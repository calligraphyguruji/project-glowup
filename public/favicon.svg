<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#13171D" />
      <stop offset="100%" stop-color="#07080A" />
    </radialGradient>
    
    <!-- Neon Lime Accent Glow Filter -->
    <filter id="limeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)" stroke="#222730" stroke-width="1.5" />

  <!-- Outer Audit Target Ring -->
  <circle cx="32" cy="32" r="21" stroke="#222730" stroke-width="2" stroke-dasharray="3 3" />

  <!-- Active Concurrency Arc (Lime) -->
  <circle cx="32" cy="32" r="21" stroke="#A3E635" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="45 85" transform="rotate(-45 32 32)" filter="url(#limeGlow)" />

  <!-- Core Invariant Ring -->
  <circle cx="32" cy="32" r="11" stroke="#A3E635" stroke-width="2" fill="#0E1116" />

  <!-- Central Pulse Nucleus -->
  <circle cx="32" cy="32" r="4.5" fill="#A3E635" filter="url(#limeGlow)" />

  <!-- Radar Scanning Dot -->
  <circle cx="47" cy="17" r="2" fill="#BEF264" />
</svg>
